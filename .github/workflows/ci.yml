name: CI

on:
  push:
  pull_request:

jobs:
  verify:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run verify:release
      - run: npm run benchmark -- --output benchmark-results/ci.json
      - uses: actions/upload-artifact@v4
        if: runner.os == 'Linux'
        with:
          name: geolint-benchmark-${{ runner.os }}
          path: benchmark-results/ci.json
